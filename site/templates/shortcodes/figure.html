{% if src %}
<figure class="{% if position %}{{ position }}{% else -%} center {%- endif %}">
  <img
    loading="lazy"
    decoding="async"
    {%
    if
    width
    %}width="{{ width }}"
    {%
    endif
    %}
    {%
    if
    height
    %}height="{{ height }}"
    {%
    endif
    %}
    src="{{ src | safe }}"
    {%
    if
    alt
    %}
    alt="{{ alt }}"
    {%
    endif
    %}{%
    if
    style
    %}
    style="{{ style }}"
    {%
    endif
    %}
  />
  {% if caption %}
  <figcaption
    class="{% if caption_position %}{{ caption_position }}{% else -%} center {%- endif %}"
    {%
    if
    caption_style
    %}
    style="{{ caption_style | safe }}"
    {%
    endif
    %}
  >
    {{ caption }}
  </figcaption>
  {% endif %}
</figure>
{% endif %}
