<div class="youtube is-flex is-justify-content-center is-align-items-center">
  <iframe
    title="{{ title | default(value="YouTube video") }}"
    width="100%"
    src="https://www.youtube.com/embed/{{ id }}"
    frameborder="0"
    loading="lazy"
    allow="
      accelerometer;
      autoplay;
      clipboard-write;
      encrypted-media;
      gyroscope;
      picture-in-picture;
    "
    allowfullscreen
    style="border: inset; border-radius: 5px; aspect-ratio: 16/9">
  </iframe>
</div>
